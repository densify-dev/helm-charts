name: Check GPU exporter chart

on:
  pull_request:
    paths:
      - charts/gpu-process-exporter/**
      - .github/workflows/gpu-exporter-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.20.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Lint chart
        run: helm lint charts/gpu-process-exporter

      - name: Check labels
        run: python charts/gpu-process-exporter/tests/check_version_labels.py

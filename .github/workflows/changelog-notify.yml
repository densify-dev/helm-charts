name: Email chart changelog updates

on:
  # Send one digest each Monday. The script only sends when the chart's
  # changelog contains additions in the preceding seven days.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      before:
        description: 'Compare from this commit (default: previous commit)'
        default: 'HEAD~1'
      dry_run:
        description: 'Only print what would be sent (no emails)'
        type: boolean
        default: true
      test_mode:
        description: 'Send to the SUBSCRIBERS_TEST secret instead of real subscribers'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: changelog-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --disable-pip-version-check markdown==3.7

      - name: Determine digest range
        id: range
        env:
          MANUAL_BEFORE: ${{ inputs.before }}
        run: |
          if [ -n "$MANUAL_BEFORE" ]; then
            before="$MANUAL_BEFORE"
          else
            # Continue from the last successful production delivery. The
            # time-based fallback is only used to initialize the checkpoint.
            before=$(git rev-parse -q --verify refs/tags/changelog-notify/last-successful || true)
            if [ -z "$before" ]; then
              before=$(git rev-list -1 --before="7 days ago" HEAD || true)
            fi
          fi
          if [ -z "$before" ]; then
            before=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"

      - name: Send changelog emails
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SUBSCRIBERS_KUBEX_AUTOMATION_STACK: ${{ secrets.SUBSCRIBERS_KUBEX_AUTOMATION_STACK }}
          SUBSCRIBERS_TEST: ${{ secrets.SUBSCRIBERS_TEST }}
          BEFORE_SHA: ${{ steps.range.outputs.before }}
          AFTER_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: python3 .github/scripts/notify_changelog.py

      - name: Save successful delivery checkpoint
        if: github.event_name == 'schedule'
        env:
          CHECKPOINT_TAG: changelog-notify/last-successful
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$CHECKPOINT_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$CHECKPOINT_TAG" --force

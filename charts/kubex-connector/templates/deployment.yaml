apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubex-connector.fullname" . }}-deployment
  labels:
    app: {{ include "kubex-connector.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    {{- with omit .Values.extraLabels "app" "app.kubernetes.io/name" "app.kubernetes.io/instance" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.extraAnnotations }}
  annotations:
    {{- toYaml .Values.extraAnnotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "kubex-connector.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "kubex-connector.name" . }}
        {{- include "kubex-connector.selectorLabels" . | nindent 8 }}
        {{- with omit .Values.extraLabels "app" "app.kubernetes.io/name" "app.kubernetes.io/instance" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.extraAnnotations }}
      annotations:
        {{- toYaml .Values.extraAnnotations | nindent 8 }}
      {{- end }}
    spec:
      {{- $kubexHost := include "kubex-connector.kubexHost" . }}
      {{- $kubexClusterName := include "kubex-connector.kubexClusterName" . }}
      {{- $localKubex := .Values.kubex | default dict }}
      {{- $env := .Values.env | default dict }}
      {{- $proxyWsURL := trim (toString (default "" (index $env "CONNECTOR_PROXY_WS_URL"))) }}
      {{- $tenantID := trim (toString (default "" (index $env "CONNECTOR_TENANT_ID"))) }}
      {{- $clusterID := trim (toString (default "" (index $env "CONNECTOR_CLUSTER_ID"))) }}
      {{- $relayEnabled := and .Values.relay.enabled (eq $proxyWsURL "") }}
      {{- $forwarderConfigMapName := trim (default "" .Values.forwarderConfigMap.name) }}
      {{- $forwarderSecretName := trim (default "" .Values.forwarderCredentialsSecretRef.name) }}
      {{- $useForwarderConfigMap := and (eq $kubexHost "") (eq $kubexClusterName "") (ne $forwarderConfigMapName "") }}
      {{- $useForwarderSecretRef := ne $forwarderSecretName "" }}
      {{- if and $relayEnabled .Values.relay.hostAliases }}
      hostAliases:
      {{- toYaml .Values.relay.hostAliases | nindent 6 }}
      {{- end }}
      {{- with .Values.securityContext }}
      {{- if or .runAsUser .runAsGroup .fsGroup }}
      securityContext:
        {{- with .runAsUser }}
        runAsUser: {{ . }}
        {{- end }}
        {{- with .runAsGroup }}
        runAsGroup: {{ . }}
        {{- end }}
        {{- with .fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if and $relayEnabled .Values.relay.tlsCaSecretName }}
      volumes:
      - name: relay-ca
        secret:
          secretName: {{ .Values.relay.tlsCaSecretName }}
      {{- end }}
      containers:
      - name: {{ include "kubex-connector.name" . }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          runAsNonRoot: {{ .Values.containerSecurityContext.runAsNonRoot }}
          allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
          readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
          {{- with .Values.containerSecurityContext.capabilities }}
          capabilities:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext.seccompProfile }}
          seccompProfile:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        env:
        {{- if $useForwarderConfigMap }}
        - name: KUBEX_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ $forwarderConfigMapName | quote }}
              key: kubex_host
        {{- end }}
        - name: CONNECTOR_PROXY_WS_URL
          {{- if $proxyWsURL }}
          value: {{ $proxyWsURL | quote }}
          {{- else if $relayEnabled }}
          value: {{ printf "ws://127.0.0.1%s/tunnel/connect" .Values.relay.listenAddr | quote }}
          {{- else if $useForwarderConfigMap }}
          value: "wss://$(KUBEX_HOST)/tunnel/connect"
          {{- else }}
          value: {{ include "kubex-connector.relayUpstreamWssUrl" . | quote }}
          {{- end }}
        - name: CONNECTOR_TENANT_ID
          {{- if $tenantID }}
          value: {{ $tenantID | quote }}
          {{- else if $useForwarderConfigMap }}
          valueFrom:
            configMapKeyRef:
              name: {{ $forwarderConfigMapName | quote }}
              key: kubex_tenant_id
          {{- else }}
          value: {{ include "kubex-connector.tenantID" . | quote }}
          {{- end }}
        - name: CONNECTOR_CLUSTER_ID
          {{- if $clusterID }}
          value: {{ $clusterID | quote }}
          {{- else if $useForwarderConfigMap }}
          valueFrom:
            configMapKeyRef:
              name: {{ $forwarderConfigMapName | quote }}
              key: kubex_cluster_name
          {{- else }}
          value: {{ include "kubex-connector.clusterID" . | quote }}
          {{- end }}
        - name: CONNECTOR_HEARTBEAT_SECONDS
          value: {{ required "heartbeatSeconds is required" (default .Values.heartbeatSeconds (index $env "CONNECTOR_HEARTBEAT_SECONDS")) | quote }}
        - name: CONNECTOR_REQUEST_TIMEOUT_SECONDS
          value: {{ required "requestTimeoutSeconds is required" (default .Values.requestTimeoutSeconds (index $env "CONNECTOR_REQUEST_TIMEOUT_SECONDS")) | quote }}
        - name: CONNECTOR_SERVICES_JSON
          value: {{ required "connectorServices is required and must contain at least one service" .Values.connectorServices | toJson | quote }}
        {{- $managedEnv := list "CONNECTOR_PROXY_WS_URL" "CONNECTOR_TENANT_ID" "CONNECTOR_CLUSTER_ID" "CONNECTOR_HEARTBEAT_SECONDS" "CONNECTOR_REQUEST_TIMEOUT_SECONDS" "CONNECTOR_SERVICES_JSON" }}
        {{- range $name, $value := $env }}
        {{- if not (has $name $managedEnv) }}
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- range .Values.extraEnv }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
      {{- if $relayEnabled }}
      - name: relay
        image: "{{ .Values.relay.image.repository }}:{{ .Values.relay.image.tag }}"
        imagePullPolicy: {{ .Values.relay.image.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          {{- with .Values.containerSecurityContext.capabilities }}
          capabilities:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext.seccompProfile }}
          seccompProfile:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        env:
        - name: GATEWAY_MODE
          value: ws-relay
        - name: RELAY_LISTEN_ADDR
          value: {{ .Values.relay.listenAddr | quote }}
        - name: RELAY_CONNECT_PATH
          value: {{ .Values.relay.connectPath | quote }}
        {{- if $useForwarderConfigMap }}
        - name: KUBEX_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ $forwarderConfigMapName | quote }}
              key: kubex_host
        {{- end }}
        - name: RELAY_UPSTREAM_WSS_URL
          {{- if $useForwarderConfigMap }}
          value: "wss://$(KUBEX_HOST)/tunnel/connect"
          {{- else }}
          value: {{ include "kubex-connector.relayUpstreamWssUrl" . | quote }}
          {{- end }}
        - name: DENSIFY_BASE_URL
          {{- if $useForwarderConfigMap }}
          value: "https://$(KUBEX_HOST)"
          {{- else }}
          value: {{ printf "https://%s" (include "kubex-connector.kubexHost" .) | quote }}
          {{- end }}
        - name: DENSIFY_USERNAME
          {{- if $useForwarderSecretRef }}
          valueFrom:
            secretKeyRef:
              name: {{ $forwarderSecretName | quote }}
              key: {{ .Values.forwarderCredentialsSecretRef.usernameKey | quote }}
          {{- else }}
          valueFrom:
            secretKeyRef:
              name: densify-api-secret
              key: username
          {{- end }}
        - name: DENSIFY_EPASSWORD
          {{- if $useForwarderSecretRef }}
          valueFrom:
            secretKeyRef:
              name: {{ $forwarderSecretName | quote }}
              key: {{ .Values.forwarderCredentialsSecretRef.epasswordKey | quote }}
          {{- else }}
          valueFrom:
            secretKeyRef:
              name: densify-api-secret
              key: epassword
          {{- end }}
        {{- if and .Values.relay.tlsCaSecretName .Values.relay.tlsCaKey }}
        - name: SSL_CERT_FILE
          value: /etc/relay-ca/{{ .Values.relay.tlsCaKey }}
        {{- end }}
        {{- range .Values.relay.extraEnv }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- if .Values.relay.tlsCaSecretName }}
        volumeMounts:
        - name: relay-ca
          mountPath: /etc/relay-ca
          readOnly: true
        {{- end }}
        ports:
        - containerPort: 18181
          name: relay
        {{- if .Values.relay.resources }}
        resources:
          {{- toYaml .Values.relay.resources | nindent 10 }}
        {{- end }}
      {{- end }}

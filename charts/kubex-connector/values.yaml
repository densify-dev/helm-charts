enabled: false

image:
  repository: densify/kubex-connector
  tag: 1.18.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: registry-secret

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

extraLabels: {}

extraAnnotations: {}

heartbeatSeconds: 10
requestTimeoutSeconds: 30

# Port for the connector's Prometheus metrics endpoint (`/metrics`), which serves
# `kubex_connector_build_info`. Sets CONNECTOR_METRICS_ADDR and the `metrics` container port.
metricsPort: 9090

connectorServices:
  - service_id: kubex-ai-cdi
    upstream_url: http://kubex-ai-cdi-service:8080/mcp

kubex:
  url:
    host: ""
  clusterName: ""

forwarderConfigMap:
  name: kubex-connector-runtime

forwarderCredentialsSecretRef:
  name: ""
  usernameKey: username
  epasswordKey: epassword

# Direct connector environment overrides, primarily for standalone development.
env: {}

extraEnv: []

relay:
  enabled: true
  image:
    repository: densify/automation-gateway
    tag: "1.11"
    pullPolicy: IfNotPresent
  listenAddr: ":18181"
  # Port for the relay's Prometheus metrics endpoint (`/metrics`), which serves
  # `kubex_automation_gateway_build_info`. Sets the relay's METRICS_ADDR and the `relay-metrics` container port.
  metricsPort: 8182
  connectPath: "/tunnel/connect"
  tlsCaSecretName: ""
  tlsCaKey: ca.crt
  hostAliases: []
  extraEnv: []
  resources: {}

resources: {}

securityContext:
  runAsUser: null
  runAsGroup: null
  fsGroup: null

nodeSelector: {}

tolerations: []

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

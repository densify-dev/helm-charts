image:
  repository: kubex-connector
  tag: dev
  pullPolicy: IfNotPresent

env:
  CONNECTOR_PROXY_WS_URL: "ws://172.18.0.3:31908/tunnel/connect"
  CONNECTOR_TENANT_ID: "tenant-a"
  CONNECTOR_CLUSTER_ID: "cluster-1"
  CONNECTOR_HEARTBEAT_SECONDS: "10"
  CONNECTOR_REQUEST_TIMEOUT_SECONDS: "30"

relay:
  enabled: false

connectorServices:
  - service_id: cdi
    upstream_url: http://kubex-ai-cdi-service:8080/mcp
  - service_id: echo
    upstream_url: http://kubex-echo:8080

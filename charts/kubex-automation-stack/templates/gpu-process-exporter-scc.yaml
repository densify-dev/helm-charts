{{- if and .Values.openshift.enabled (index .Values "gpu-process-exporter" "enabled") }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ .Release.Name }}-gpu-exporter
  labels:
    app.kubernetes.io/name: gpu-process-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
allowHostDirVolumePlugin: true
allowHostPID: true
allowPrivilegedContainer: true
userNamespaceLevel: AllowHostLevel
allowedCapabilities:
  - '*'
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
# Keep sorted alphabetically: the API server stores SCC volumes sorted, and an
# unsorted list shows up as a permanent diff in GitOps tools such as Argo CD.
volumes:
  - configMap
  - emptyDir
  - hostPath
  - projected
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:{{ .Release.Name }}-gpu-exporter
  labels:
    app.kubernetes.io/name: gpu-process-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - {{ .Release.Name }}-gpu-exporter
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-gpu-exporter-scc
  labels:
    app.kubernetes.io/name: gpu-process-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Release.Name }}-gpu-exporter
subjects:
  - kind: ServiceAccount
    name: {{ default "gpu-process-exporter" (index (index .Values "gpu-process-exporter") "serviceAccount" "name") }}
    namespace: {{ .Release.Namespace }}
{{- end }}

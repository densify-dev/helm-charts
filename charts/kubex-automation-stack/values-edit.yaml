stack:
  densify:
    username: '<changeme-username>' # mandatory (unless createSecret = false)
    encrypted_password: '<changeme-encrypted-password>' # mandatory (unless createSecret = false)

# Optional: Enable OpenShift mode. When enabled, also install with the OpenShift overlay values file.
# openshift:
#   enabled: true

# Kubex Data Collector
# TIP: Use YAML anchors (&name) to avoid repeating cluster name and host for automation-engine
container-optimization-data-forwarder:
  config:
    forwarder:
      densify:
        url:
          host: &kubexHost '<changeme-kubex-host>' # mandatory: <instance>.kubex.ai
    clusters:
      - name: &clusterName '<changeme-cluster-name>' # mandatory

  # Optional: Additional labels to add to CronJob and Job resources
  #extraLabels:
  #  my-custom-label: my-value-1
  # Optional: Additional annotations to add to CronJob and Job resources
  #extraAnnotations:
  #  my-custom-annotation: my-value-2

# The following values are optional, if job cleanup is required;
# each one of these should be a non-negative integer (0 is allowed)
  # cronJob:
    # successfulJobsHistoryLimit: <value>
    # failedJobsHistoryLimit: <value>
    # ttlSecondsAfterFinished: <value> # applies for both the cronjob and the job
    # backoffLimit: <value> # applies for both the cronjob and the job, default: 4

# Optional: Enable the connector and CDI tunnel path.
# Keep these opt-in until the feature is generally available in production.
# kubex-connector:
#   enabled: true
# kubex-ai-cdi:
#   enabled: true

# Optional: Enable the Kubex Automation Engine for automated workload rightsizing
# Automatically uses the same credentials, cluster name (*clusterName), and host (*kubexHost)
# kubex-automation-engine:
#   enabled: true
#   kubex:
#     clusterName: *clusterName  # References the anchor above
#     url:
#       host: *kubexHost  # References the anchor above

# The following section is optional, and is required only in the following use-case:
# 1. The persistent volume for Prometheus has to use an explicit storage class (not the default)

# prometheus: # optional
  # server:
    # persistentVolume:
    #   storageClass: <changeme-storage-class>

# Optional: Disable the bundled Prometheus deployment.
# Required when deploying on OpenShift; the OpenShift overlay values file already sets this.
# stack:
#   prometheus:
#     deploy: false

# Ephemeral Storage Metrics (optional)
# Deploys k8s-ephemeral-storage-metrics to collect ephemeral storage metrics for containers
# k8s-ephemeral-storage-metrics:
#   enabled: false  # Set to false to disable ephemeral storage metrics collection (default: true)

# Optional: Enable node-labeler subchart (disabled by default)
# node-labeler:
#   enabled: true

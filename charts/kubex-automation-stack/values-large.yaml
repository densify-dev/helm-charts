# Use this file for a large k8s cluster (10001+ containers):
kubex-connector:
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  relay:
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
kubex-ai-cdi:
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "4"
      memory: "4Gi"
prometheus:
  server:
    resources:
      requests:
        memory: "20Gi"
        cpu: "2000m"
      limits:
          memory: "40Gi"
  prometheus-node-exporter:
    resources:
      requests:
        memory: "40Mi"
        cpu: "30m"
      limits:
        memory: "100Mi"
beyla:
  resources:
    requests:
      memory: "512Mi"
      cpu: "50m"
    limits:
      memory: "1Gi"

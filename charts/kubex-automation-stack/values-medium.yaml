# Use this file for a medium k8s cluster (5001-10000 containers):
kubex-connector:
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  relay:
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
kubex-ai-cdi:
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
prometheus:
  server:
    resources:
      requests:
        memory: "10Gi"
        cpu: "1000m"
      limits:
        memory: "20Gi"
  prometheus-node-exporter:
    resources:
      requests:
        memory: "30Mi"
        cpu: "20m"
      limits:
        memory: "80Mi"
beyla:
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"

# Use this file for a medium k8s cluster (5001-10000 containers):
kubex-automation-engine:
  resources:
    requests:
      cpu: "200m"
      memory: "2Gi"
    limits:
      cpu: null
      memory: "4Gi"
  gateway:
    resources:
      requests:
        cpu: "15m"
        memory: "60Mi"
      limits:
        cpu: null
        memory: "350Mi"
  compactionScheduler:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: null
        memory: "512Mi"
  compactionDescheduler:
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        cpu: null
        memory: "1Gi"

kubex-connector:
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      memory: "1Gi"
  relay:
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        memory: "1Gi"
kubex-ai-cdi:
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      memory: "2Gi"
prometheus:
  server:
    resources:
      requests:
        memory: "10Gi"
        cpu: "1000m"
      limits:
        memory: "20Gi"
  prometheus-node-exporter:
    resources:
      requests:
        memory: "30Mi"
        cpu: "20m"
      limits:
        memory: "80Mi"
beyla:
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
k8s-ephemeral-storage-metrics:
  resources:
    requests:
      cpu: "400m"
      memory: "1Gi"
    limits:
      memory: "2Gi"

{{- end }}
{{- end }}
{{- with $permissions.openshiftMachineConfig }}
{{- if include "kubex-ai-cdi.openshiftGroup" (dict "enabled" .enabled "openshift" ($.Values.openshift | default dict).enabled) }}
- apiGroups: ["machineconfiguration.openshift.io"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.podLogs }}
{{- if .enabled }}
- apiGroups: [""]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.workloads }}
{{- if .enabled }}
- apiGroups: ["apps"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.batchWorkloads }}
{{- if .enabled }}
- apiGroups: ["batch"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.rollouts }}
{{- if .enabled }}
- apiGroups: ["argoproj.io"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.strimzi }}
{{- if .enabled }}
- apiGroups: ["core.strimzi.io"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.openshiftApps }}
{{- if include "kubex-ai-cdi.openshiftGroup" (dict "enabled" .enabled "openshift" ($.Values.openshift | default dict).enabled) }}
- apiGroups: ["apps.openshift.io"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- with .coreResources }}
- apiGroups: [""]
  resources:
    {{- toYaml . | nindent 4 }}
  verbs:
    {{- toYaml $.Values.rbac.permissions.openshiftApps.verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- with $permissions.models }}
{{- if and .enabled .apiGroups }}
- apiGroups:
    {{- toYaml .apiGroups | nindent 4 }}
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.openshift }}
{{- if include "kubex-ai-cdi.openshiftGroup" (dict "enabled" .enabled "openshift" ($.Values.openshift | default dict).enabled) }}
- apiGroups: ["machine.openshift.io"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.karpenter }}
{{- if .enabled }}
- apiGroups: ["karpenter.sh"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.karpenterAWS }}
{{- if .enabled }}
- apiGroups: ["karpenter.k8s.aws"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.karpenterAzure }}
{{- if .enabled }}
- apiGroups: ["karpenter.azure.com"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.karpenterClusterAPI }}
{{- if .enabled }}
- apiGroups: ["karpenter.cluster.x-k8s.io"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.kubexCRDs }}
{{- if .enabled }}
- apiGroups: ["rightsizing.kubex.ai"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with $permissions.selfSubjectReview }}
{{- if .enabled }}
- apiGroups: ["authorization.k8s.io"]
  resources:
    {{- toYaml .resources | nindent 4 }}
  verbs:
    {{- toYaml .verbs | nindent 4 }}
{{- end }}
{{- end }}
{{- with .Values.rbac.additionalRules }}
{{ tpl (ternary . (toYaml .) (kindIs "string" .)) $ }}
{{- end }}
{{- end }}
{{- end }}

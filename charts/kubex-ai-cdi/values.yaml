enabled: false

image:
  repository: densify/kubex-ai-cdi
  tag: 1.7.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: registry-secret

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

clusterRoleNameOverride: ""
clusterRoleBindingNameOverride: ""

service:
  name: kubex-ai-cdi-service
  type: ClusterIP
  port: 8080

extraLabels: {}

extraAnnotations: {}

prometheus:
  url: ""

worker:
  toolTimeout: "20s"
  maxPayloadBytes: 262144
  enableClusterScopeOps: true
  clusterName: ""
  clusterNameConfigMap:
    name: ""
    key: kubex_cluster_name
  allowedNamespaces: ""

rbac:
  enabled: true
  permissions:
    core:
      enabled: true
      resources: ["pods", "services", "configmaps", "namespaces", "nodes", "events", "resourcequotas", "limitranges", "endpoints"]
      verbs: ["get", "list"]
    hpa:
      enabled: true
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list"]
    keda:
      enabled: true
      resources: ["scaledobjects", "scaledjobs"]
      verbs: ["get", "list"]
    vpa:
      enabled: true
      resources: ["verticalpodautoscalers"]
      verbs: ["get", "list"]
    disruptionBudgets:
      enabled: true
      resources: ["poddisruptionbudgets"]
      verbs: ["get", "list"]
    priorityClasses:
      enabled: true
      resources: ["priorityclasses"]
      verbs: ["get", "list"]
    endpointSlices:
      enabled: true
      resources: ["endpointslices"]
      verbs: ["get", "list"]
    # API registration and health configuration, not measurements.
    apiServices:
      enabled: true
      resources: ["apiservices"]
      verbs: ["get", "list"]
    # Opt-in: authentication CRDs can contain inline credentials.
    kedaAuthentication:
      enabled: false
      resources: ["triggerauthentications", "clustertriggerauthentications"]
      verbs: ["get", "list"]
    kedaHTTP:
      enabled: false
      resources: ["httpscaledobjects", "interceptorroutes"]
      verbs: ["get", "list"]
    kedaEventing:
      enabled: false
      resources: ["cloudeventsources", "clustercloudeventsources"]
      verbs: ["get", "list"]
    vpaCheckpoints:
      enabled: false
      resources: ["verticalpodautoscalercheckpoints"]
      verbs: ["get", "list"]
    serviceAccounts:
      enabled: false
      resources: ["serviceaccounts"]
      verbs: ["get", "list"]
    knativeServing:
      enabled: false
      resources: ["services", "configurations", "revisions", "routes"]
      verbs: ["get", "list"]
    # Metric is a configuration object, not a metrics API read.
    knativeAutoscaling:
      enabled: false
      resources: ["podautoscalers", "metrics"]
      verbs: ["get", "list"]
    knativeNetworking:
      enabled: false
      resources: ["serverlessservices"]
      verbs: ["get", "list"]
    prometheusObjects:
      enabled: false
      resources: ["prometheuses", "prometheusagents", "servicemonitors", "podmonitors", "scrapeconfigs", "probes", "prometheusrules", "thanosrulers"]
      verbs: ["get", "list"]
    storageCore:
      enabled: false
      resources: ["persistentvolumeclaims", "persistentvolumes"]
      verbs: ["get", "list"]
    storage:
      enabled: false
      resources: ["storageclasses", "csinodes", "csistoragecapacities", "volumeattachments"]
      verbs: ["get", "list"]
    clusterAPI:
      enabled: false
      resources: ["clusters", "machines", "machinesets", "machinedeployments", "machinepools"]
      verbs: ["get", "list"]
    # MachinePools on older Cluster API installations.
    clusterAPIExperimental:
      enabled: false
      resources: ["machinepools"]
      verbs: ["get", "list"]
    openshiftAutoscaling:
      enabled: false
      resources: ["machineautoscalers", "clusterautoscalers"]
      verbs: ["get", "list"]
    podLogs:
      enabled: true
      resources: ["pods/log"]
      verbs: ["get"]
    workloads:
      enabled: true
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      verbs: ["get", "list"]
    batchWorkloads:
      enabled: true
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list"]
    rollouts:
      enabled: true
      resources: ["rollouts", "analysisruns", "experiments"]
      verbs: ["get", "list"]
    strimzi:
      enabled: true
      resources: ["strimzipodsets"]
      verbs: ["get", "list"]
    openshiftApps:
      enabled: true
      resources: ["deploymentconfigs"]
      coreResources: ["replicationcontrollers"]
      verbs: ["get", "list"]
    models:
      enabled: false
      apiGroups: []
      resources: ["models"]
      verbs: ["get", "list"]
    openshift:
      enabled: false
      resources: ["machines", "machinesets", "machinedeployments", "machinehealthchecks", "controlplanemachinesets"]
      verbs: ["get", "list"]
    karpenter:
      enabled: false
      resources: ["nodepools", "nodeclaims"]
      verbs: ["get", "list"]
    karpenterAWS:
      enabled: false
      resources: ["ec2nodeclasses"]
      verbs: ["get", "list"]
    karpenterAzure:
      enabled: false
      resources: ["nodeclasses"]
      verbs: ["get", "list"]
    kubexCRDs:
      enabled: true
      resources: ["automationstrategies", "clusterautomationstrategies", "clustergpurebalancingpolicies", "clusterproactivepolicies", "clusterrollbackpolicies", "clusterstaticpolicies", "globalconfigurations", "gpuconsolidationpolicies", "gpurebalancingpolicies", "podaffinitypolicies", "policyevaluations", "proactivepolicies", "rollbackpolicies", "staticpolicies"]
      verbs: ["get", "list"]
    selfSubjectReview:
      enabled: true
      resources: ["selfsubjectrulesreviews", "selfsubjectaccessreviews"]
      verbs: ["create"]

securityContext:
  runAsUser: null
  runAsGroup: null
  fsGroup: null

nodeSelector: {}

tolerations: []

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

serviceAccount:
  create: true
  name: ""

resources: {}

livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

logging:
  level: info

extraEnv: []

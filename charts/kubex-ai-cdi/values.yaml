enabled: false

image:
  repository: densify/kubex-ai-cdi
  tag: 1.13.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: registry-secret

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

clusterRoleNameOverride: ""
clusterRoleBindingNameOverride: ""

service:
  name: kubex-ai-cdi-service
  type: ClusterIP
  port: 8080

extraLabels: {}

extraAnnotations: {}

prometheus:
  url: ""

worker:
  toolTimeout: "20s"
  maxPayloadBytes: 262144
  enableClusterScopeOps: true
  clusterName: ""
  clusterNameConfigMap:
    name: ""
    key: kubex_cluster_name
  allowedNamespaces: ""

# OpenShift mode. The OpenShift-specific RBAC groups below (openshift, openshiftApps,
# openshiftAutoscaling, openshiftConfig, openshiftOperator, openshiftMachineConfig) have
# enabled: null, which follows this switch. Set a group's enabled to true or false to override it.
openshift:
  enabled: false

rbac:
  enabled: true
  # Read-only access to non-sensitive objects is on by default. Groups for CRDs that are absent
  # from a cluster are harmless: the rule just matches nothing. Left off on purpose:
  #   kedaAuthentication  TriggerAuthentications point at credential Secrets and secret stores.
  #   models              no apiGroups by default; supply them to use it.
  permissions:
    core:
      enabled: true
      resources: ["pods", "services", "configmaps", "namespaces", "nodes", "events", "resourcequotas", "limitranges", "endpoints"]
      verbs: ["get", "list"]
    hpa:
      enabled: true
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list"]
    keda:
      enabled: true
      resources: ["scaledobjects", "scaledjobs"]
      verbs: ["get", "list"]
    vpa:
      enabled: true
      resources: ["verticalpodautoscalers"]
      verbs: ["get", "list"]
    disruptionBudgets:
      enabled: true
      resources: ["poddisruptionbudgets"]
      verbs: ["get", "list"]
    priorityClasses:
      enabled: true
      resources: ["priorityclasses"]
      verbs: ["get", "list"]
    endpointSlices:
      enabled: true
      resources: ["endpointslices"]
      verbs: ["get", "list"]
    apiServices:
      enabled: true
      resources: ["apiservices"]
      verbs: ["get", "list"]
    customResourceDefinitions:
      enabled: true
      resources: ["customresourcedefinitions"]
      verbs: ["get", "list"]
    kedaAuthentication:
      enabled: false
      resources: ["triggerauthentications", "clustertriggerauthentications"]
      verbs: ["get", "list"]
    kedaHTTP:
      enabled: true
      resources: ["httpscaledobjects", "interceptorroutes"]
      verbs: ["get", "list"]
    kedaEventing:
      enabled: true
      resources: ["cloudeventsources", "clustercloudeventsources"]
      verbs: ["get", "list"]
    vpaCheckpoints:
      enabled: true
      resources: ["verticalpodautoscalercheckpoints"]
      verbs: ["get", "list"]
    serviceAccounts:
      enabled: true
      resources: ["serviceaccounts"]
      verbs: ["get", "list"]
    knativeServing:
      enabled: true
      resources: ["services", "configurations", "revisions", "routes"]
      verbs: ["get", "list"]
    knativeAutoscaling:
      enabled: true
      resources: ["podautoscalers", "metrics"]
      verbs: ["get", "list"]
    knativeNetworking:
      enabled: true
      resources: ["serverlessservices"]
      verbs: ["get", "list"]
    prometheusObjects:
      enabled: true
      resources: ["prometheuses", "prometheusagents", "servicemonitors", "podmonitors", "scrapeconfigs", "probes", "prometheusrules", "thanosrulers"]
      verbs: ["get", "list"]
    storageCore:
      enabled: true
      resources: ["persistentvolumeclaims", "persistentvolumes"]
      verbs: ["get", "list"]
    storage:
      enabled: true
      resources: ["storageclasses", "csinodes", "csistoragecapacities", "volumeattachments"]
      verbs: ["get", "list"]
    clusterAPI:
      enabled: true
      resources: ["clusters", "machines", "machinesets", "machinedeployments", "machinepools"]
      verbs: ["get", "list"]
    # MachinePools on older Cluster API installations.
    clusterAPIExperimental:
      enabled: true
      resources: ["machinepools"]
      verbs: ["get", "list"]
    openshiftAutoscaling:
      enabled: null
      resources: ["machineautoscalers", "clusterautoscalers"]
      verbs: ["get", "list"]
    openshiftConfig:
      enabled: null
      resources: ["schedulers", "clusterversions", "clusteroperators"]
      verbs: ["get", "list"]
    openshiftOperator:
      enabled: null
      resources: ["kubeschedulers"]
      verbs: ["get", "list"]
    openshiftMachineConfig:
      enabled: null
      resources: ["machineconfigpools"]
      verbs: ["get", "list"]
    podLogs:
      enabled: true
      resources: ["pods/log"]
      verbs: ["get"]
    workloads:
      enabled: true
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      verbs: ["get", "list"]
    batchWorkloads:
      enabled: true
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list"]
    rollouts:
      enabled: true
      resources: ["rollouts", "analysisruns", "experiments"]
      verbs: ["get", "list"]
    strimzi:
      enabled: true
      resources: ["strimzipodsets"]
      verbs: ["get", "list"]
    openshiftApps:
      enabled: null
      resources: ["deploymentconfigs"]
      coreResources: ["replicationcontrollers"]
      verbs: ["get", "list"]
    models:
      enabled: false
      apiGroups: []
      resources: ["models"]
      verbs: ["get", "list"]
    openshift:
      enabled: null
      resources: ["machines", "machinesets", "machinedeployments", "machinehealthchecks", "controlplanemachinesets"]
      verbs: ["get", "list"]
    karpenter:
      enabled: true
      resources: ["nodepools", "nodeclaims", "nodeoverlays"]
      verbs: ["get", "list"]
    karpenterAWS:
      enabled: true
      resources: ["ec2nodeclasses"]
      verbs: ["get", "list"]
    karpenterAzure:
      enabled: true
      resources: ["nodeclasses"]
      verbs: ["get", "list"]
    karpenterClusterAPI:
      enabled: true
      resources: ["clusterapinodeclasses"]
      verbs: ["get", "list"]
    kubexCRDs:
      enabled: true
      # Every resource in the rightsizing.kubex.ai API group, including ones added later.
      resources: ["*"]
      verbs: ["get", "list"]
    selfSubjectReview:
      enabled: true
      resources: ["selfsubjectrulesreviews", "selfsubjectaccessreviews"]
      verbs: ["create"]
  # Extra ClusterRole rules, appended after the permission groups above. Accepts a list of rules or a
  # string, and is rendered with tpl, so it can use Helm template expressions, for example:
  #   additionalRules:
  #     - apiGroups: ["example.com"]
  #       resources: ["{{ .Release.Name }}-widgets"]
  #       verbs: ["get", "list"]
  additionalRules: []

securityContext:
  runAsUser: null
  runAsGroup: null
  fsGroup: null

nodeSelector: {}

tolerations: []

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

serviceAccount:
  create: true
  name: ""

resources: {}

livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

logging:
  level: info

extraEnv: []
